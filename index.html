            background: #D32F2F;

        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFB300;
        }

        /* Glassmorphism & Custom Effects */
        .glass-card {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 179, 0, 0.15);
        }

        .category-tab-active {
            background: linear-gradient(135deg, #D32F2F, #9A0000);
            color: #ffffff;
            border-color: #FFB300;

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;

                    </div>
                </div>

                <!-- Call to Action & Phone Button -->
                <div class="flex flex-col sm:flex-row items-center gap-3">

    <!-- CATEGORY FILTER NAVIGATION -->

            <div id="categoryTabs" class="flex items-center gap-2 sm:gap-3 overflow-x-auto no-scrollbar py-1">
                <!-- Categories injected by JavaScript -->
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT / MENU ITEMS GRID -->

            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                </div>

                    <span>إرسال الطلب للواتساب</span>
                </button>
            </div>

        </div>
    </div>

            const searchTerm = searchInputEl.value.trim().toLowerCase();

            let filtered = MENU_DATA.filter(item => {
                const matchesCategory = (currentCategory === 'all') || (item.category === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || item.desc.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            itemCountDisplayEl.textContent = filtered.length;

            if (filtered.length === 0) {
                menuGridEl.innerHTML = `
                    <div class="col-span-full py-16 text-center text-gray-500 space-y-3">

                    priceDisplay = `${item.price} ج.م`;

                    const minPrice = Math.min(...item.variations.map(v => v.price));
                    priceDisplay = `يبدأ من ${minPrice} ج.م`;

        /* CUSTOMIZE ITEM MODAL FUNCTIONS */
        function openItemModal(itemId) {
            selectedItemForModal = MENU_DATA.find(i => i.id === itemId);
            if (!selectedItemForModal) return;

            modalQty = 1;
            selectedExtras = [];
            document.getElementById('itemNotes').value = '';

            document.getElementById('modalTitle').textContent = selectedItemForModal.name;
            document.getElementById('modalDesc').textContent = selectedItemForModal.desc;
            document.getElementById('modalQty').textContent = modalQty;

            // Render Variations
            const sizeSection = document.getElementById('sizeSection');
            const sizeOptions = document.getElementById('sizeOptions');
            const proteinSection = document.getElementById('proteinSection');

            if (selectedItemForModal.variations && selectedItemForModal.variations.length > 0) {
                sizeSection.classList.remove('hidden');
                selectedVariation = selectedItemForModal.variations[0];
                renderSizeOptions();
            } else {
                sizeSection.classList.add('hidden');
                selectedVariation = null;
            }

            // Render Burger Protein Options
            if (selectedItemForModal.hasProteinOption) {
                proteinSection.classList.remove('hidden');
                selectProtein('chicken');
            } else {
                proteinSection.classList.add('hidden');
            }

            // Render Extras Checklist
            renderExtrasChecklist();

            updateModalPrice();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function renderSizeOptions() {
            const sizeOptions = document.getElementById('sizeOptions');
            sizeOptions.innerHTML = selectedItemForModal.variations.map((v, idx) => `
                <button type="button" onclick="selectVariation(${idx})" 
                        class="size-btn border p-3 rounded-xl text-right transition flex flex-col justify-between ${selectedVariation && selectedVariation.name === v.name ? 'border-brand-yellow bg-brand-yellow/10 text-brand-yellow font-bold' : 'border-gray-700 bg-brand-dark text-gray-300'}">
                    <span class="text-xs font-bold">${v.name}</span>
                    <span class="text-sm font-black mt-1">${v.price} ج.م</span>
                </button>
            `).join('');
        }

        function selectVariation(idx) {
            selectedVariation = selectedItemForModal.variations[idx];
            renderSizeOptions();
            updateModalPrice();
        }

        function selectProtein(type) {
            selectedProtein = type;
            document.querySelectorAll('.protein-btn').forEach(btn => {
                if (btn.getAttribute('data-protein') === type) {
                    btn.className = 'protein-btn border-2 border-brand-yellow bg-brand-yellow/10 text-brand-yellow p-3 rounded-xl text-center font-bold text-sm transition';
                } else {
                    btn.className = 'protein-btn border border-gray-700 bg-brand-dark p-3 rounded-xl text-center font-bold text-sm text-gray-400 hover:border-brand-yellow transition';
                }
            });

            // Filter burger variation based on protein selection
            if (selectedItemForModal.hasProteinOption) {
                const matchedVar = selectedItemForModal.variations.find(v => v.protein === type);
                if (matchedVar) {
                    selectedVariation = matchedVar;
                    renderSizeOptions();
                }
            }
            updateModalPrice();
        }

        function renderExtrasChecklist() {
            const extrasList = document.getElementById('extrasList');
            extrasList.innerHTML = GLOBAL_EXTRAS.map(ext => `
                <label class="flex items-center justify-between bg-brand-dark p-3 rounded-xl border border-gray-800 cursor-pointer hover:border-gray-700">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" onchange="toggleExtra('${ext.id}')" class="accent-brand-red w-4 h-4 rounded">
                        <span class="text-xs font-bold text-gray-200">${ext.name}</span>
                    </div>
                    <span class="text-xs font-extrabold text-brand-yellow">+${ext.price} ج.م</span>
                </label>
            `).join('');
        }

        function toggleExtra(extId) {
            const ext = GLOBAL_EXTRAS.find(e => e.id === extId);
            if (!ext) return;

            const exists = selectedExtras.some(e => e.id === extId);
            if (exists) {
                selectedExtras = selectedExtras.filter(e => e.id !== extId);
            } else {
                selectedExtras.push(ext);
            }
            updateModalPrice();
        }

        function adjustModalQty(delta) {
            modalQty = Math.max(1, modalQty + delta);
            document.getElementById('modalQty').textContent = modalQty;
            updateModalPrice();
        }

        function calculateSingleItemPrice() {
            let base = selectedItemForModal.price || (selectedVariation ? selectedVariation.price : 0);
            let extrasTotal = selectedExtras.reduce((sum, e) => sum + e.price, 0);
            return base + extrasTotal;
        }

        function updateModalPrice() {
            let singlePrice = calculateSingleItemPrice();
            let total = singlePrice * modalQty;
            document.getElementById('modalTotalPrice').textContent = `${total} ج.م`;
        }

        function closeItemModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        /* CONFIRM & ADD TO CART */
        function confirmAddToCart() {
            const notes = document.getElementById('itemNotes').value.trim();

            const cartItem = {
                cartId: Date.now() + Math.random(),
                itemId: selectedItemForModal.id,
                name: selectedItemForModal.name,
                variation: selectedVariation ? selectedVariation.name : null,
                protein: selectedItemForModal.hasProteinOption ? (selectedProtein === 'chicken' ? 'فراخ' : 'لحمة') : null,
                extras: [...selectedExtras],
                notes: notes,
                qty: modalQty,
                unitPrice: calculateSingleItemPrice(),
                totalPrice: calculateSingleItemPrice() * modalQty
            };

            cart.push(cartItem);
            closeItemModal();
            updateCartUI();
        }

        /* CART UI & CALCULATIONS */

            const cartBadge = document.getElementById('cartBadge');
            const cartBarTotal = document.getElementById('cartBarTotal');

            const totalItemsCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const grandTotal = cart.reduce((sum, i) => sum + i.totalPrice, 0);

            cartBadge.textContent = totalItemsCount;
            cartBarTotal.textContent = `${grandTotal} ج.م`;

            if (cart.length > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        /* CART MODAL & CHECKOUT */
        function openCartModal() {
            if (cart.length === 0) return;

            renderCartModalItems();
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function renderCartModalItems() {
            const cartItemsList = document.getElementById('cartItemsList');
            const cartModalTotal = document.getElementById('cartModalTotal');

            const grandTotal = cart.reduce((sum, i) => sum + i.totalPrice, 0);
            cartModalTotal.textContent = `${grandTotal} ج.م`;

            cartItemsList.innerHTML = cart.map(item => `
                <div class="bg-brand-dark p-4 rounded-xl border border-gray-800 space-y-2">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <h4 class="font-extrabold text-white text-sm">${item.name}</h4>
                            ${item.variation ? `<span class="text-xs text-brand-yellow block font-bold">${item.variation}</span>` : ''}
                            ${item.extras.length > 0 ? `<span class="text-xs text-gray-400 block">إضافات: ${item.extras.map(e => e.name).join('، ')}</span>` : ''}
                            ${item.notes ? `<span class="text-xs text-gray-400 block italic">ملاحظات: ${item.notes}</span>` : ''}
                        </div>
                        <span class="font-black text-brand-yellow text-base">${item.totalPrice} ج.م</span>
                    </div>

                    <div class="flex items-center justify-between border-t border-gray-800/60 pt-2 mt-2">
                        <div class="flex items-center gap-2">
                            <button onclick="changeCartItemQty(${item.cartId}, -1)" class="w-7 h-7 bg-gray-800 hover:bg-brand-red rounded text-white font-bold flex items-center justify-center text-xs">-</button>
                            <span class="text-xs font-bold text-white">${item.qty}</span>
                            <button onclick="changeCartItemQty(${item.cartId}, 1)" class="w-7 h-7 bg-gray-800 hover:bg-brand-red rounded text-white font-bold flex items-center justify-center text-xs">+</button>
                        </div>
                        <button onclick="removeCartItem(${item.cartId})" class="text-red-500 hover:text-red-400 text-xs font-bold flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> حذف
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function changeCartItemQty(cartId, delta) {
            const item = cart.find(i => i.cartId === cartId);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                removeCartItem(cartId);
                return;
            }
            item.totalPrice = item.unitPrice * item.qty;

            updateCartUI();
            renderCartModalItems();
        }

        function removeCartItem(cartId) {
            cart = cart.filter(i => i.cartId !== cartId);
            updateCartUI();
            if (cart.length === 0) {
                closeCartModal();
            } else {
                renderCartModalItems();
            }
        }

        function toggleAddressInput(show) {
            const group = document.getElementById('addressGroup');
            if (show) {
                group.classList.remove('hidden');
            } else {
                group.classList.add('hidden');
            }
        }

        /* WHATSAPP ORDER FORMATTING & DIRECT LINK */
        function sendOrderToWhatsApp() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const orderType = document.querySelector('input[name="orderType"]:checked').value;
            const address = document.getElementById('custAddress').value.trim();
            const payment = document.getElementById('custPayment').value;

            if (!name || !phone) {
                alert('يرجى ملء الاسم ورقم الهاتف لإتمام الطلب.');
                return;
            }

            if (orderType.includes('دليفري') && !address) {
                alert('يرجى كتابة عنوان التوصيل بالتفصيل.');
                return;
            }

            const grandTotal = cart.reduce((sum, i) => sum + i.totalPrice, 0);

            // Construct Beautiful WhatsApp Message
            let text = `*طلب جديد من مطعم تشيكن بوص - CHICKEN BOSS* 🍗🔥\n\n`;
            text += `👤 *الاسم:* ${name}\n`;
            text += `📞 *الهاتف:* ${phone}\n`;
            text += `🚚 *طريقة الاستلام:* ${orderType}\n`;
            if (orderType.includes('دليفري')) {
                text += `📍 *العنوان:* ${address}\n`;
            }
            text += `💳 *طريقة الدفع:* ${payment}\n\n`;

            text += `-----------------------------------\n`;
            text += `🛒 *الأصناف المطلوبة:*\n\n`;

            cart.forEach((item, index) => {
                text += `${index + 1}. *${item.name}* (العدد: ${item.qty})\n`;
                if (item.variation) text += `   • الحجم/النوع: ${item.variation}\n`;
                if (item.extras.length > 0) text += `   • الإضافات: ${item.extras.map(e => e.name).join(' + ')}\n`;
                if (item.notes) text += `   • ملاحظات: ${item.notes}\n`;
                text += `   • السعر: ${item.totalPrice} ج.م\n\n`;
            });

            text += `-----------------------------------\n`;
            text += `💰 *الإجمالي النهائي:* *${grandTotal} ج.م*\n\n`;
            text += `شكراً لاختياركم تشيكن بوص! ✨`;

            const encodedText = encodeURIComponent(text);
            const whatsappNumber = '201009212624'; // Branch phone number
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedText}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
